<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同步观影</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0e1a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:16px;
}

.container{
    max-width:1100px;
    margin:0 auto;
}

.video-wrapper{
    background:black;
    border-radius:20px;
    overflow:hidden;
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
}

.controls{
    margin-top:16px;
    background:#11161f;
    border-radius:20px;
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
}

button{
    border:none;
    background:#2a3650;
    color:white;
    padding:10px 18px;
    border-radius:40px;
    cursor:pointer;
}

button.primary{
    background:#4f46e5;
}

input{
    background:#1a2233;
    border:1px solid #2f3b54;
    color:white;
    padding:10px 14px;
    border-radius:40px;
    outline:none;
}

#roomInput{
    flex:1;
    min-width:120px;
}

#videoUrl{
    width:100%;
    margin-top:12px;
}

.status{
    margin-left:auto;
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}

.viewer{
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

    <div class="video-wrapper">

        <video
            id="video"
            controls
            preload="metadata"
            controlsList="nodownload"
        >
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
        </video>

    </div>

    <div class="controls">

        <input
            id="roomInput"
            placeholder="输入房间号"
        >

        <button
            id="joinBtn"
            class="primary"
        >
            创建房间
        </button>

        <button id="copyBtn">
            复制房间号
        </button>

        <button id="syncBtn">
            强制同步
        </button>

        <div
            class="viewer"
            id="viewerCount"
        >
            👥 未加入
        </div>

        <div
            class="status"
            id="status"
        >
            未连接
        </div>

    </div>

    <input
        id="videoUrl"
        value="https://media.w3.org/2010/05/sintel/trailer.mp4"
        placeholder="输入 MP4 视频链接"
    >

</div>

<script>

const API_URL = '/api/rooms';

const video =
    document.getElementById('video');

const roomInput =
    document.getElementById('roomInput');

const joinBtn =
    document.getElementById('joinBtn');

const copyBtn =
    document.getElementById('copyBtn');

const syncBtn =
    document.getElementById('syncBtn');

const statusEl =
    document.getElementById('status');

const viewerCount =
    document.getElementById('viewerCount');

const videoUrl =
    document.getElementById('videoUrl');

let currentRoom = null;

let isSyncing = false;

let pollInterval = null;

let isHost = false;

const clientId =
    localStorage.getItem('clientId') ||
    Math.random().toString(36).slice(2);

localStorage.setItem(
    'clientId',
    clientId
);

function updateStatus(text){

    statusEl.innerHTML = text;
}

async function joinRoom(roomId){

    try{

        const res =
            await fetch(API_URL,{
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    roomId,
                    clientId,
                    currentTime:video.currentTime,
                    isPlaying:!video.paused,
                    videoUrl:videoUrl.value,
                    isHost
                })
            });

        const data =
            await res.json();

        if(data.success){

            currentRoom = roomId;

            isHost =
                data.room.host === clientId;

            updateStatus(
                isHost
                ? `房主: ${roomId}`
                : `已加入: ${roomId}`
            );

            if(pollInterval){
                clearInterval(
                    pollInterval
                );
            }

            pollInterval =
                setInterval(
                    pollRoom,
                    2000
                );

            pollRoom();
        }

    }catch(e){
        console.log(e);
    }
}

async function pollRoom(){

    if(!currentRoom) return;

    try{

        const res =
            await fetch(
                `${API_URL}?roomId=${currentRoom}`
            );

        const data =
            await res.json();

        if(
            !data.success ||
            !data.room
        ){
            return;
        }

        const room =
            data.room;

        viewerCount.innerHTML =
            `👥 ${room.viewers || 1} 人`;

        // 房主不接收同步
        if(isHost){
            return;
        }

        if(isSyncing) return;

        isSyncing = true;

        try{

            // 视频链接同步
            if(
                room.videoUrl &&
                room.videoUrl !==
                videoUrl.value
            ){

                videoUrl.value =
                    room.videoUrl;

                video.src =
                    room.videoUrl;

                video.load();
            }

            // 播放同步
            if(
                room.isPlaying &&
                video.paused
            ){

                await video.play()
                    .catch(()=>{});
            }

            // 暂停同步
            if(
                !room.isPlaying &&
                !video.paused
            ){

                video.pause();
            }

            // 时间同步
            const diff =
                Math.abs(
                    video.currentTime -
                    room.currentTime
                );

            if(diff > 1.5){

                video.currentTime =
                    room.currentTime;
            }

        }finally{

            setTimeout(()=>{

                isSyncing = false;

            },300);
        }

    }catch(e){
        console.log(e);
    }
}

async function syncNow(){

    // 只有房主上传状态
    if(!isHost){
        return;
    }

    if(
        !currentRoom ||
        isSyncing
    ){
        return;
    }

    try{

        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                roomId:currentRoom,
                clientId,
                currentTime:video.currentTime,
                isPlaying:!video.paused,
                videoUrl:videoUrl.value,
                isHost
            })
        });

    }catch(e){
        console.log(e);
    }
}

// 播放同步
video.addEventListener(
    'play',
    ()=>{

        syncNow();
    }
);

// 暂停同步
video.addEventListener(
    'pause',
    ()=>{

        syncNow();
    }
);

// 拖动同步
video.addEventListener(
    'seeked',
    ()=>{

        syncNow();
    }
);

// 每秒更新一次时间
setInterval(()=>{

    if(
        currentRoom &&
        isHost &&
        !video.paused
    ){

        syncNow();
    }

},1000);

// 创建房间
joinBtn.onclick =
    async ()=>{

        isHost = true;

        let room =
            roomInput.value.trim();

        if(!room){

            room =
                Math.floor(
                    Math.random()*10000
                ).toString();

            roomInput.value =
                room;
        }

        await joinRoom(room);
    };

// 回车加入别人房间
roomInput.addEventListener(
    'keydown',
    async (e)=>{

        if(e.key === 'Enter'){

            isHost = false;

            const room =
                roomInput.value.trim();

            if(room){

                await joinRoom(room);
            }
        }
    }
);

copyBtn.onclick =
    ()=>{

        const room =
            currentRoom ||
            roomInput.value.trim();

        if(!room) return;

        navigator.clipboard
            .writeText(room);
    };

syncBtn.onclick =
    ()=>{

        pollRoom();
    };

videoUrl.addEventListener(
    'change',
    ()=>{

        video.src =
            videoUrl.value;

        video.load();

        syncNow();
    }
);

window.addEventListener(
    'beforeunload',
    ()=>{

        if(!currentRoom) return;

        fetch(API_URL,{
            method:'DELETE',
            headers:{
                'Content-Type':
                    'application/json'
            },
            body:JSON.stringify({
                roomId:currentRoom
            })
        });
    }
);

roomInput.value =
    Math.floor(
        Math.random()*10000
    );

</script>

</body>
</html>
