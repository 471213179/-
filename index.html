<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>一起看 · 房间列表同步观影</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 两栏布局 */
        .two-columns {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .video-section {
            flex: 2;
            min-width: 300px;
        }
        .rooms-section {
            flex: 1;
            min-width: 280px;
            background: #11161f;
            border-radius: 24px;
            padding: 20px;
            height: fit-content;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .video-card {
            background: #11161f;
            border-radius: 24px;
            overflow: hidden;
        }
        .video-wrapper {
            background: #000;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        .controls {
            padding: 16px;
            background: #0f141e;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #2a3650;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.primary {
            background: #4f46e5;
        }
        button.primary:hover {
            background: #6366f1;
        }
        button.danger {
            background: #dc2626;
        }
        .status {
            background: #1a2233;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
        }
        .dot.connected {
            background: #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        
        /* 房间列表样式 */
        .rooms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .rooms-header h3 {
            color: #eef4ff;
        }
        .create-room-btn {
            background: #22c55e;
            padding: 8px 16px;
            font-size: 13px;
        }
        .room-item {
            background: #1a2233;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .room-item:hover {
            border-color: #4f46e5;
            transform: translateX(4px);
        }
        .room-item.active {
            border-color: #4f46e5;
            background: #1f2a44;
        }
        .room-name {
            font-weight: 600;
            color: #eef4ff;
            display: flex;
            justify-content: space-between;
        }
        .room-info {
            font-size: 12px;
            color: #8b9acb;
            margin-top: 8px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .room-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            background: #2a3650;
        }
        .room-status.playing {
            background: #22c55e20;
            color: #22c55e;
        }
        .room-status.paused {
            background: #f59e0b20;
            color: #f59e0b;
        }
        .empty-rooms {
            text-align: center;
            color: #5b6a8c;
            padding: 40px;
        }
        
        .video-row {
            margin-top: 12px;
            padding: 12px;
            background: #0c111b;
            border-radius: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .video-row input {
            flex: 2;
            background: #1a2233;
            border: 1px solid #2f3b54;
            padding: 8px 12px;
            border-radius: 40px;
            color: white;
            font-size: 13px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #5b6a8c;
        }
        @media (max-width: 900px) {
            .two-columns { flex-direction: column; }
            .rooms-section { max-height: 400px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="two-columns">
        <!-- 左侧：视频播放器 -->
        <div class="video-section">
            <div class="video-card">
                <div class="video-wrapper">
                    <video id="video" controls controlsList="nodownload" preload="metadata">
                        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
                    </video>
                </div>
                <div class="controls">
                    <button id="playPauseBtn" class="primary">▶ 播放/暂停</button>
                    <button id="refreshBtn">🔄 刷新房间</button>
                    <div class="status">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">未加入房间</span>
                    </div>
                </div>
                <div class="video-row">
                    <input type="text" id="videoUrl" placeholder="视频链接" value="https://media.w3.org/2010/05/sintel/trailer.mp4">
                    <button id="loadVideoBtn">加载</button>
                </div>
            </div>
        </div>

        <!-- 右侧：房间列表 -->
        <div class="rooms-section">
            <div class="rooms-header">
                <h3>📺 公开房间</h3>
                <button id="createRoomBtn" class="create-room-btn">➕ 创建房间</button>
            </div>
            <div id="roomList">
                <div class="empty-rooms">暂无房间，点击「创建房间」</div>
            </div>
            <div style="margin-top: 16px; font-size: 12px; color: #5b6a8c; text-align: center;">
                💡 点击房间即可进入，自动同步房主进度
            </div>
        </div>
    </div>
    <div class="footer">
        🎬 创建房间 → 别人点击进入 → 自动同步你的播放进度
    </div>
</div>

<script>
    // ========== 配置 ==========
    const API_URL = '/api/rooms';  // Vercel 函数地址
    
    // DOM 元素
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const loadVideoBtn = document.getElementById('loadVideoBtn');
    const videoUrl = document.getElementById('videoUrl');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const roomListDiv = document.getElementById('roomList');
    
    // 状态
    let currentRoomId = null;
    let currentRoomName = null;
    let isInRoom = false;
    let heartbeatInterval = null;
    let refreshInterval = null;
    let ignoreSync = false;
    
    // 显示消息
    function showMessage(msg, isError = false) {
        let toast = document.querySelector('.custom-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a253c;padding:10px 28px;border-radius:50px;font-size:14px;z-index:10000;white-space:nowrap;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.background = isError ? '#dc2626' : '#1a253c';
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2000);
    }
    
    // 更新连接状态
    function updateStatus(inRoom, roomName = '') {
        if (inRoom) {
            statusText.innerHTML = `🎬 观看中: ${roomName}`;
            statusDot.className = 'dot connected';
            isInRoom = true;
        } else {
            statusText.innerHTML = '未加入房间';
            statusDot.className = 'dot';
            isInRoom = false;
        }
    }
    
    // 获取房间列表
    async function fetchRooms() {
        try {
            const res = await fetch(API_URL);
            const rooms = await res.json();
            renderRoomList(rooms);
        } catch (err) {
            console.error('获取房间失败:', err);
        }
    }
    
    // 渲染房间列表
    function renderRoomList(rooms) {
        if (!rooms || rooms.length === 0) {
            roomListDiv.innerHTML = '<div class="empty-rooms">✨ 暂无房间，点击「创建房间」</div>';
            return;
        }
        
        // 按更新时间排序
        rooms.sort((a, b) => b.lastUpdate - a.lastUpdate);
        
        roomListDiv.innerHTML = rooms.map(room => `
            <div class="room-item ${currentRoomId === room.roomId ? 'active' : ''}" data-room-id="${room.roomId}">
                <div class="room-name">
                    <span>🏠 ${escapeHtml(room.roomName)}</span>
                    <span class="room-status ${room.isPlaying ? 'playing' : 'paused'}">
                        ${room.isPlaying ? '▶ 播放中' : '⏸ 暂停'}
                    </span>
                </div>
                <div class="room-info">
                    <span>👥 ${room.viewers || 1} 人在看</span>
                    <span>📌 ${formatTime(room.currentTime)}</span>
                    <span>🕐 ${formatTimeAgo(room.lastUpdate)}</span>
                </div>
            </div>
        `).join('');
        
        // 绑定点击事件
        document.querySelectorAll('.room-item').forEach(el => {
            el.addEventListener('click', () => {
                const roomId = el.dataset.roomId;
                const room = rooms.find(r => r.roomId === roomId);
                if (room) {
                    joinRoom(room);
                }
            });
        });
    }
    
    // 加入房间
    async function joinRoom(room) {
        if (currentRoomId === room.roomId) {
            showMessage('已经在当前房间');
            return;
        }
        
        showMessage(`📺 正在进入 ${room.roomName}...`);
        
        // 停止心跳
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
        
        // 同步房主进度
        ignoreSync = true;
        
        // 切换视频源
        if (video.src !== room.videoUrl) {
            video.src = room.videoUrl;
            video.load();
            await new Promise(resolve => {
                video.addEventListener('loadedmetadata', resolve, { once: true });
                setTimeout(resolve, 2000);
            });
        }
        
        // 同步进度
        video.currentTime = room.currentTime;
        if (room.isPlaying) {
            video.play().catch(e => console.log('播放失败'));
        } else {
            video.pause();
        }
        
        setTimeout(() => {
            ignoreSync = false;
        }, 500);
        
        currentRoomId = room.roomId;
        currentRoomName = room.roomName;
        updateStatus(true, room.roomName);
        
        showMessage(`✅ 已加入 ${room.roomName}，正在同步`);
        
        // 开始心跳（作为观众也发送心跳，让房主知道有人在看）
        startHeartbeat(false);
    }
    
    // 创建房间
    async function createRoom() {
        const roomName = prompt('给房间起个名字吧', `@${Math.floor(Math.random() * 1000)}的房间`);
        if (!roomName) return;
        
        const roomId = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        const currentTime = video.currentTime || 0;
        const isPlaying = !video.paused;
        const videoUrlValue = videoUrl.value;
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    roomId,
                    roomName,
                    currentTime,
                    isPlaying,
                    videoUrl: videoUrlValue,
                    action: 'create'
                })
            });
            
            currentRoomId = roomId;
            currentRoomName = roomName;
            updateStatus(true, roomName);
            
            // 开始心跳
            startHeartbeat(true);
            
            showMessage(`✅ 房间 "${roomName}" 创建成功！`);
            fetchRooms();
        } catch (err) {
            showMessage('创建失败: ' + err.message, true);
        }
    }
    
    // 发送心跳（更新房间状态）
    function startHeartbeat(isHost) {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        
        heartbeatInterval = setInterval(async () => {
            if (!currentRoomId) return;
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomId: currentRoomId,
                        roomName: currentRoomName,
                        currentTime: video.currentTime,
                        isPlaying: !video.paused,
                        videoUrl: videoUrl.value,
                        action: 'heartbeat'
                    })
                });
            } catch (err) {
                console.error('心跳失败:', err);
            }
        }, 5000);
    }
    
    // 退出房间
    function leaveRoom() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
        currentRoomId = null;
        currentRoomName = null;
        updateStatus(false);
        showMessage('已离开房间');
    }
    
    // 工具函数
    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    function formatTimeAgo(timestamp) {
        const diff = Date.now() - timestamp;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
        return `${Math.floor(diff / 3600000)}小时前`;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // 事件绑定
    playPauseBtn.onclick = () => {
        if (video.paused) {
            video.play().catch(e => console.log('播放失败'));
        } else {
            video.pause();
        }
    };
    
    refreshBtn.onclick = () => {
        fetchRooms();
        showMessage('房间列表已刷新');
    };
    
    createRoomBtn.onclick = createRoom;
    
    loadVideoBtn.onclick = () => {
        const url = videoUrl.value.trim();
        if (url) {
            video.src = url;
            video.load();
            showMessage('视频加载中...');
        }
    };
    
    // 页面关闭时清理
    window.addEventListener('beforeunload', () => {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        if (refreshInterval) clearInterval(refreshInterval);
    });
    
    // 启动定时刷新房间列表
    refreshInterval = setInterval(fetchRooms, 3000);
    
    // 初始加载
    fetchRooms();
    showMessage('✨ 点击「创建房间」或点击房间进入');
</script>
</body>
</html>
