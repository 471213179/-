<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同步观影（Telegram直链版）</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#0a0e1a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:16px;
}

.container{max-width:1100px;margin:0 auto;}

.video-wrapper{
    background:black;
    border-radius:20px;
    overflow:hidden;
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
}

.controls{
    margin-top:16px;
    background:#11161f;
    border-radius:20px;
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
}

button{
    border:none;
    background:#2a3650;
    color:white;
    padding:10px 18px;
    border-radius:40px;
    cursor:pointer;
}

button.primary{background:#4f46e5;}

input{
    background:#1a2233;
    border:1px solid #2f3b54;
    color:white;
    padding:10px 14px;
    border-radius:40px;
    outline:none;
}

#roomInput{flex:1;min-width:120px;}

.status{
    margin-left:auto;
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}

.viewer{
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="video-wrapper">
        <video id="video" controls preload="metadata"></video>
    </div>

    <div class="controls">

        <input id="roomInput" placeholder="输入房间号">

        <button id="joinBtn" class="primary">创建房间</button>
        <button id="copyBtn">复制房间号</button>
        <button id="syncBtn">强制同步</button>

        <div class="viewer" id="viewerCount">👥 未加入</div>
        <div class="status" id="status">未连接</div>

    </div>

    <input id="videoUrl"
        placeholder="输入 Telegram / MP4 直链"
        value=""
    >

</div>

<script>

const API_URL = "/api/rooms";

const video = document.getElementById("video");
const roomInput = document.getElementById("roomInput");
const joinBtn = document.getElementById("joinBtn");
const copyBtn = document.getElementById("copyBtn");
const syncBtn = document.getElementById("syncBtn");
const statusEl = document.getElementById("status");
const viewerCount = document.getElementById("viewerCount");
const videoUrl = document.getElementById("videoUrl");

let currentRoom = null;
let isHost = false;
let syncing = false;
let pollTimer = null;

const clientId =
    localStorage.getItem("cid") ||
    Math.random().toString(36).slice(2);

localStorage.setItem("cid", clientId);

function setStatus(t){
    statusEl.innerText = t;
}

function loadVideo(url){
    if(!url) return;

    video.innerHTML = "";

    const source = document.createElement("source");
    source.src = url;

    const clean = url.split("?")[0].toLowerCase();

    // ⭐ Telegram / MP4 兼容
    if(url.includes("telegram") || url.includes("t.me")){
        source.type = "video/mp4";
    }
    else if(clean.endsWith(".mp4")) source.type = "video/mp4";
    else if(clean.endsWith(".webm")) source.type = "video/webm";
    else if(clean.endsWith(".ogg")) source.type = "video/ogg";

    video.appendChild(source);
    video.load();
}

/* ================= 房间 ================= */

async function join(roomId){

    const res = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            roomId,
            clientId,
            currentTime:video.currentTime,
            isPlaying:!video.paused,
            videoUrl:videoUrl.value,
            isHost
        })
    });

    const data = await res.json();

    if(data.success){

        currentRoom = roomId;
        isHost = data.room.host === clientId;

        setStatus(isHost ? "房主: " + roomId : "已加入: " + roomId);

        clearInterval(pollTimer);
        pollTimer = setInterval(syncPoll, 2000);

        syncPoll();
    }
}

/* ================= 拉取同步 ================= */

async function syncPoll(){

    if(!currentRoom) return;

    const res = await fetch(`${API_URL}?roomId=${currentRoom}`);
    const data = await res.json();

    if(!data.room) return;

    const room = data.room;

    viewerCount.innerText = `👥 ${room.viewers || 1} 人`;

    if(isHost || syncing) return;

    syncing = true;

    try{

        if(room.videoUrl && room.videoUrl !== videoUrl.value){
            videoUrl.value = room.videoUrl;
            loadVideo(room.videoUrl);
        }

        if(room.isPlaying && video.paused){
            video.play().catch(()=>{});
        }

        if(!room.isPlaying && !video.paused){
            video.pause();
        }

        if(Math.abs(video.currentTime - room.currentTime) > 1.5){
            video.currentTime = room.currentTime;
        }

    } finally {
        setTimeout(()=> syncing = false, 300);
    }
}

/* ================= 上传同步 ================= */

async function push(){

    if(!isHost || !currentRoom || syncing) return;

    await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            roomId:currentRoom,
            clientId,
            currentTime:video.currentTime,
            isPlaying:!video.paused,
            videoUrl:videoUrl.value,
            isHost
        })
    });
}

/* ================= 事件 ================= */

video.addEventListener("play", push);
video.addEventListener("pause", push);
video.addEventListener("seeked", push);

setInterval(()=>{
    if(currentRoom && isHost && !video.paused){
        push();
    }
},1000);

/* ================= UI ================= */

joinBtn.onclick = async ()=>{
    isHost = true;

    let room = roomInput.value.trim();

    if(!room){
        room = Math.floor(Math.random()*9999).toString();
        roomInput.value = room;
    }

    await join(room);
};

roomInput.addEventListener("keydown", async (e)=>{
    if(e.key === "Enter"){
        isHost = false;
        await join(roomInput.value.trim());
    }
});

copyBtn.onclick = ()=>{
    const r = currentRoom || roomInput.value;
    if(r) navigator.clipboard.writeText(r);
};

syncBtn.onclick = syncPoll;

/* ================= 视频输入 ================= */

videoUrl.addEventListener("change", ()=>{
    loadVideo(videoUrl.value);
    push();
});

/* ================= 初始化 ================= */

roomInput.value = Math.floor(Math.random()*9999);

</script>

</body>
</html>
