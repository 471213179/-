<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一起看 · 同步观影</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .video-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            outline: none;
        }

        .controls {
            background: #11161f;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 20px 20px;
        }

        button {
            background: #2a3650;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
        }

        button.primary {
            background: #4f46e5;
        }

        .status {
            background: #1a2233;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: orange;
        }

        .dot.connected {
            background: #22c55e;
        }

        .room-panel {
            background: #11161f;
            margin-top: 16px;
            padding: 16px;
            border-radius: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .room-panel input {
            flex: 1;
            background: #1a2233;
            border: 1px solid #2f3b54;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .video-row {
            background: #0c111b;
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
        }

        .video-row input {
            flex: 1;
            background: #1a2233;
            border: 1px solid #2f3b54;
            padding: 8px 14px;
            border-radius: 40px;
            color: white;
        }

        .viewer-count {
            background: #1a2233;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
        }

        .sync-badge {
            background: #2a3650;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #5b6a8c;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            button {
                padding: 6px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="video-wrapper">
        <video
            id="video"
            controls
            preload="metadata"
            controlsList="nodownload"
        >
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
        </video>
    </div>

    <div class="controls">

        <div style="display:flex;gap:10px;">
            <button id="playPauseBtn" class="primary">
                ▶ 播放/暂停
            </button>

            <button id="forceSyncBtn">
                🔄 强制同步
            </button>
        </div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
            <span class="sync-badge" id="syncBadge">📡 等待</span>
        </div>

    </div>

    <div class="room-panel">

        <input
            type="text"
            id="roomInput"
            placeholder="房间号"
        >

        <button id="joinBtn" class="primary">
            🔗 加入房间
        </button>

        <button id="copyRoomBtn">
            📋 复制房间号
        </button>

        <div class="viewer-count" id="viewerCount">
            👥 未加入
        </div>

    </div>

    <div class="video-row">

        <input
            type="text"
            id="videoUrl"
            value="https://media.w3.org/2010/05/sintel/trailer.mp4"
            placeholder="MP4视频链接"
        >

        <button id="loadVideoBtn">
            加载
        </button>

    </div>

    <div class="footer">
        💡 两人输入相同房间号即可同步看片
    </div>

</div>

<script>

const API_URL = '/api/rooms';

const video = document.getElementById('video');
const playPauseBtn = document.getElementById('playPauseBtn');
const forceSyncBtn = document.getElementById('forceSyncBtn');
const joinBtn = document.getElementById('joinBtn');
const copyRoomBtn = document.getElementById('copyRoomBtn');
const roomInput = document.getElementById('roomInput');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');
const syncBadge = document.getElementById('syncBadge');
const videoUrl = document.getElementById('videoUrl');
const loadVideoBtn = document.getElementById('loadVideoBtn');
const viewerCountSpan = document.getElementById('viewerCount');

let currentRoomId = null;

let clientId =
    localStorage.getItem('clientId') ||
    Math.random().toString(36).slice(2);

localStorage.setItem('clientId', clientId);

let heartbeatInterval = null;
let pollInterval = null;

let isSyncing = false;
let isRoomJoined = false;

function showMessage(msg) {
    console.log(msg);
}

function updateStatus(connected, room = '') {
    if (connected) {
        statusText.innerHTML = `✅ 房间: ${room}`;
        statusDot.className = 'dot connected';
    } else {
        statusText.innerHTML = '未连接';
        statusDot.className = 'dot';
    }
}

async function sendHeartbeat() {

    if (!currentRoomId || !isRoomJoined) return;

    try {

        await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'heartbeat',
                roomId: currentRoomId,
                clientId,
                currentTime: video.currentTime,
                isPlaying: !video.paused,
                videoUrl: videoUrl.value
            })
        });

    } catch (e) {
        console.log(e);
    }
}

async function pollRoom() {

    if (!currentRoomId || !isRoomJoined) return;

    try {

        const res = await fetch(
            `${API_URL}?roomId=${currentRoomId}`
        );

        const data = await res.json();

        if (!data.success || !data.room) {
            return;
        }

        const room = data.room;

        viewerCountSpan.innerHTML =
            `👥 ${room.viewers || 1} 人在线`;

        if (room.viewers <= 1) {
            syncBadge.innerHTML = '等待对方加入';
            return;
        }

        syncBadge.innerHTML = '🟢 已同步';

        if (isSyncing) return;

        isSyncing = true;

        try {

            // 同步视频地址
            if (
                room.videoUrl &&
                room.videoUrl !== videoUrl.value
            ) {

                videoUrl.value = room.videoUrl;

                const wasPlaying = !video.paused;

                video.src = room.videoUrl;

                video.load();

                if (wasPlaying) {
                    video.addEventListener(
                        'canplay',
                        () => video.play(),
                        { once: true }
                    );
                }
            }

            // 同步时间
            const timeDiff =
                Math.abs(
                    video.currentTime -
                    room.currentTime
                );

            if (
                timeDiff > 0.3 &&
                room.currentTime < video.duration
            ) {
                video.currentTime = room.currentTime;
            }

            // 同步播放状态
            if (
                video.paused &&
                room.isPlaying
            ) {
                await video.play().catch(() => {});
            }

            if (
                !video.paused &&
                !room.isPlaying
            ) {
                video.pause();
            }

        } finally {

            setTimeout(() => {
                isSyncing = false;
            }, 200);

        }

    } catch (e) {
        console.log(e);
    }
}

async function joinRoom(roomId) {

    try {

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                roomId,
                clientId,
                currentTime: video.currentTime,
                isPlaying: !video.paused,
                videoUrl: videoUrl.value
            })
        });

        const data = await res.json();

        if (data.success) {

            currentRoomId = roomId;
            isRoomJoined = true;

            updateStatus(true, roomId);

            syncBadge.innerHTML = '🟢 同步中';

            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
            }

            if (pollInterval) {
                clearInterval(pollInterval);
            }

            // 更实时
            heartbeatInterval =
                setInterval(sendHeartbeat, 300);

            pollInterval =
                setInterval(pollRoom, 300);

            pollRoom();
        }

    } catch (e) {
        console.log(e);
    }
}

async function leaveRoom() {

    if (!currentRoomId) return;

    try {

        await fetch(API_URL, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                roomId: currentRoomId,
                clientId
            })
        });

    } catch (e) {
        console.log(e);
    }

    clearInterval(heartbeatInterval);
    clearInterval(pollInterval);

    currentRoomId = null;
    isRoomJoined = false;

    updateStatus(false);
}

joinBtn.onclick = async () => {

    let room = roomInput.value.trim();

    if (!room) {
        room = Math.floor(
            Math.random() * 10000
        ).toString();

        roomInput.value = room;
    }

    if (
        currentRoomId === room &&
        isRoomJoined
    ) {
        return;
    }

    await leaveRoom();

    await joinRoom(room);
};

copyRoomBtn.onclick = () => {

    const room =
        currentRoomId ||
        roomInput.value.trim();

    if (!room) return;

    navigator.clipboard.writeText(room);
};

playPauseBtn.onclick = async () => {

    if (video.paused) {
        await video.play().catch(() => {});
    } else {
        video.pause();
    }

    sendHeartbeat();
};

forceSyncBtn.onclick = async () => {

    await sendHeartbeat();

    setTimeout(() => {
        pollRoom();
    }, 100);
};

loadVideoBtn.onclick = async () => {

    const url = videoUrl.value.trim();

    if (!url) return;

    video.src = url;

    video.load();

    sendHeartbeat();
};

video.addEventListener(
    'play',
    () => sendHeartbeat()
);

video.addEventListener(
    'pause',
    () => sendHeartbeat()
);

video.addEventListener(
    'seeked',
    () => sendHeartbeat()
);

// 更实时同步
let lastSync = 0;

video.addEventListener('timeupdate', () => {

    const now = Date.now();

    if (now - lastSync > 500) {

        lastSync = now;

        sendHeartbeat();
    }
});

window.addEventListener(
    'beforeunload',
    () => {

        if (
            currentRoomId &&
            isRoomJoined
        ) {

            navigator.sendBeacon(
                API_URL,
                JSON.stringify({
                    roomId: currentRoomId,
                    clientId
                })
            );
        }
    }
);

roomInput.value =
    Math.floor(Math.random() * 10000);

showMessage('同步观影已启动');

</script>

</body>
</html>
