<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 · 同步观影</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .video-card {
            background: #11161f;
            border-radius: 24px;
            overflow: hidden;
        }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        .toolbar {
            padding: 16px;
            background: #0f141e;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: #2a3650;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
        }
        button.primary { background: #4f46e5; }
        .status {
            background: #1a2233;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
        }
        .connected { color: #22c55e; }
        .waiting { color: #f59e0b; }
        .room-panel {
            margin-top: 16px;
            padding: 16px;
            background: #0f141e;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        input {
            background: #1a2233;
            border: 1px solid #2f3b54;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            flex: 1;
            min-width: 150px;
        }
        .video-input {
            margin-top: 12px;
            padding: 12px 16px;
            background: #0c111b;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #5b6a8c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="video-card">
        <video id="video" controls controlsList="nodownload">
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
        </video>
        <div class="toolbar">
            <button id="playBtn" class="primary">▶ 播放/暂停</button>
            <button id="syncBtn">🔄 手动同步</button>
            <div class="status">
                <span id="statusText" class="waiting">⚪ 未连接</span>
            </div>
        </div>
    </div>

    <div class="room-panel">
        <input type="text" id="roomInput" placeholder="输入房间号 (随意输入相同数字)">
        <button id="createBtn">🏠 创建/加入房间</button>
        <button id="copyBtn">📋 复制房间号</button>
    </div>

    <div class="video-input">
        <input type="text" id="urlInput" placeholder="视频链接 (MP4地址)" value="https://media.w3.org/2010/05/sintel/trailer.mp4">
        <button id="loadUrlBtn">🎬 加载视频</button>
    </div>

    <div class="footer">
        💡 两人输入相同房间号 → 都点「创建/加入房间」→ 自动连接 → 播放/暂停/进度同步
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // 使用免费公开的 Socket.io 服务器 (国内可用)
    // 这里使用一个公共测试服务器，或者自己部署
    const socket = io('https://socketio-server-demo.glitch.me', {
        transports: ['websocket', 'polling'],
        reconnection: true
    });
    
    const video = document.getElementById('video');
    const playBtn = document.getElementById('playBtn');
    const syncBtn = document.getElementById('syncBtn');
    const createBtn = document.getElementById('createBtn');
    const copyBtn = document.getElementById('copyBtn');
    const roomInput = document.getElementById('roomInput');
    const statusSpan = document.getElementById('statusText');
    const urlInput = document.getElementById('urlInput');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    
    let currentRoom = null;
    let ignoreSync = false;
    
    function updateStatus(connected, roomName = '') {
        if (connected) {
            statusSpan.innerHTML = '🟢 已同步 · 房间: ' + roomName;
            statusSpan.className = 'connected';
        } else {
            statusSpan.innerHTML = '🟡 等待连接...';
            statusSpan.className = 'waiting';
        }
    }
    
    function sendSync() {
        if (currentRoom) {
            socket.emit('sync', {
                room: currentRoom,
                time: video.currentTime,
                playing: !video.paused
            });
        }
    }
    
    // 房间操作
    createBtn.onclick = () => {
        let room = roomInput.value.trim();
        if (!room) {
            room = Math.floor(Math.random() * 10000).toString();
            roomInput.value = room;
        }
        currentRoom = room;
        socket.emit('join', room);
        updateStatus(false, room);
        
        // 复制房间号
        navigator.clipboard.writeText(room);
        alert(`房间号 "${room}" 已复制！发给对方，让对方也输入相同房间号后点「创建/加入房间」`);
    };
    
    copyBtn.onclick = () => {
        if (currentRoom) {
            navigator.clipboard.writeText(currentRoom);
            alert('房间号已复制');
        } else {
            alert('请先创建或加入房间');
        }
    };
    
    // Socket 事件
    socket.on('joined', (room) => {
        updateStatus(true, room);
        // 加入后同步当前进度给对方
        setTimeout(() => sendSync(), 500);
    });
    
    socket.on('user joined', () => {
        updateStatus(true, currentRoom);
        sendSync();
    });
    
    socket.on('sync', (data) => {
        if (ignoreSync) return;
        const timeDiff = Math.abs(video.currentTime - data.time);
        if (timeDiff > 0.5) {
            ignoreSync = true;
            video.currentTime = data.time;
            if (data.playing) video.play();
            else video.pause();
            setTimeout(() => { ignoreSync = false; }, 500);
        } else if (video.paused === data.playing) {
            // 播放状态不一致
            ignoreSync = true;
            if (data.playing) video.play();
            else video.pause();
            setTimeout(() => { ignoreSync = false; }, 300);
        }
    });
    
    socket.on('disconnect', () => {
        updateStatus(false);
    });
    
    // 本地事件
    playBtn.onclick = () => {
        if (video.paused) video.play();
        else video.pause();
        sendSync();
    };
    
    syncBtn.onclick = () => {
        sendSync();
        alert('已发送同步请求');
    };
    
    video.addEventListener('play', sendSync);
    video.addEventListener('pause', sendSync);
    video.addEventListener('seeked', sendSync);
    
    loadUrlBtn.onclick = () => {
        const newUrl = urlInput.value.trim();
        if (newUrl) {
            video.src = newUrl;
            video.load();
            alert('视频加载中...');
        }
    };
    
    // 默认随机房间号
    roomInput.value = Math.floor(Math.random() * 10000);
</script>
</body>
</html>
