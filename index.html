<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 · 同步观影</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding: 16px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .video-wrapper { background: #000; border-radius: 20px; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16 / 9; display: block; outline: none; }
        .controls { background: #11161f; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-radius: 0 0 20px 20px; }
        button { background: #2a3650; border: none; color: white; padding: 8px 20px; border-radius: 40px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        button.primary { background: #4f46e5; }
        button.primary:hover { background: #6366f1; }
        .status { background: #1a2233; padding: 6px 16px; border-radius: 40px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
        .dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        .room-panel { background: #11161f; margin-top: 16px; padding: 16px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .room-panel input { flex: 1; background: #1a2233; border: 1px solid #2f3b54; padding: 10px 16px; border-radius: 40px; color: white; font-size: 16px; text-align: center; letter-spacing: 2px; }
        .video-row { background: #0c111b; margin-top: 12px; padding: 12px 16px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .video-row input { flex: 2; background: #1a2233; border: 1px solid #2f3b54; padding: 8px 14px; border-radius: 40px; color: white; font-size: 13px; }
        .preset-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .preset-btns button { padding: 6px 14px; font-size: 12px; background: #1e2a3a; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #5b6a8c; }
        .viewer-count { background: #1a2233; padding: 6px 12px; border-radius: 40px; font-size: 12px; }
        @media (max-width: 640px) { body { padding: 12px; } button { padding: 6px 14px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="video-wrapper">
        <video id="video" controls controlsList="nodownload" preload="metadata">
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
        </video>
    </div>
    <div class="controls">
        <div style="display: flex; gap: 10px;">
            <button id="playPauseBtn" class="primary">▶ 播放/暂停</button>
            <button id="forceSyncBtn">🔄 强制同步</button>
        </div>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
        </div>
    </div>

    <div class="room-panel">
        <input type="text" id="roomInput" placeholder="房间号 (两人输入相同数字)">
        <button id="joinBtn" class="primary">🔗 加入/创建房间</button>
        <button id="copyRoomBtn">📋 复制房间号</button>
        <div class="viewer-count" id="viewerCount">👥 等待中</div>
    </div>

    <div class="video-row">
        <input type="text" id="videoUrl" placeholder="视频链接 (MP4地址)" value="https://media.w3.org/2010/05/sintel/trailer.mp4">
        <button id="loadVideoBtn">加载</button>
    </div>
    <div class="preset-btns">
        <button class="preset" data-url="https://media.w3.org/2010/05/sintel/trailer.mp4">🎬 动画短片</button>
        <button class="preset" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4">🔥 火焰特效</button>
        <button class="preset" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCar.mp4">🚗 汽车广告</button>
        <button class="preset" data-url="https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4">🐰 小兔子</button>
    </div>

    <div class="footer">
        💡 两人输入相同房间号 → 都点「加入/创建房间」→ 播放/暂停/进度自动同步（约2秒延迟）
    </div>
</div>

<script>
    // API 地址 - 部署后自动使用当前域名
    const API_URL = '/api/rooms';
    
    const video = document.getElementById('video');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const forceSyncBtn = document.getElementById('forceSyncBtn');
    const joinBtn = document.getElementById('joinBtn');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const roomInput = document.getElementById('roomInput');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const videoUrl = document.getElementById('videoUrl');
    const loadVideoBtn = document.getElementById('loadVideoBtn');
    const viewerCountSpan = document.getElementById('viewerCount');
    
    let currentRoomId = null;
    let isInRoom = false;
    let heartbeatInterval = null;
    let pollInterval = null;
    let ignoreSync = false;
    let lastSyncTime = 0;
    
    function updateStatus(connected, roomName = '') {
        if (connected) {
            statusText.innerHTML = `✅ 已同步 · 房间: ${roomName}`;
            statusDot.className = 'dot connected';
        } else {
            statusText.innerHTML = '⏳ 等待连接...';
            statusDot.className = 'dot';
        }
    }
    
    function showMessage(msg, isError = false) {
        const oldToast = document.querySelector('.toast-temp');
        if (oldToast) oldToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-temp';
        toast.textContent = msg;
        toast.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${isError ? '#dc2626' : '#1a253c'};padding:8px 24px;border-radius:50px;font-size:13px;z-index:9999;white-space:nowrap;`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    // 发送心跳（更新房间状态）
    async function sendHeartbeat() {
        if (!currentRoomId) return;
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'heartbeat',
                    roomId: currentRoomId,
                    currentTime: video.currentTime,
                    isPlaying: !video.paused,
                    videoUrl: videoUrl.value
                })
            });
        } catch (err) {
            console.error('心跳失败:', err);
        }
    }
    
    // 创建/加入房间
    async function joinRoom(roomId, roomName) {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    roomId: roomId,
                    roomName: roomName || `房间 ${roomId.slice(-4)}`,
                    currentTime: video.currentTime,
                    isPlaying: !video.paused,
                    videoUrl: videoUrl.value
                })
            });
            
            const data = await res.json();
            if (data.success) {
                currentRoomId = roomId;
                isInRoom = true;
                updateStatus(true, roomId);
                showMessage(`✅ 已加入房间: ${roomId}`);
                
                // 启动心跳（每2秒）
                if (heartbeatInterval) clearInterval(heartbeatInterval);
                heartbeatInterval = setInterval(sendHeartbeat, 2000);
                
                // 启动轮询（每3秒获取房间状态同步）
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollRoom, 3000);
                
                // 立即同步一次
                setTimeout(() => pollRoom(), 500);
            }
        } catch (err) {
            console.error('加入房间失败:', err);
            showMessage('❌ 加入房间失败', true);
        }
    }
    
    // 轮询获取房间状态并同步
    async function pollRoom() {
        if (!currentRoomId) return;
        
        try {
            const res = await fetch(API_URL);
            const rooms = await res.json();
            const room = rooms.find(r => r.roomId === currentRoomId);
            
            if (!room) {
                viewerCountSpan.innerHTML = '👥 房间不存在';
                return;
            }
            
            const viewerCount = room.viewers || 1;
            viewerCountSpan.innerHTML = `👥 ${viewerCount} 人在线`;
            
            // 只有超过1人在线时才同步
            if (viewerCount <= 1) return;
            
            // 同步时间（差异大于0.8秒才调整）
            const timeDiff = Math.abs(video.currentTime - room.currentTime);
            if (timeDiff > 0.8 && !ignoreSync) {
                ignoreSync = true;
                video.currentTime = room.currentTime;
                setTimeout(() => { ignoreSync = false; }, 500);
            }
            
            // 同步播放状态
            if (video.paused === room.isPlaying && !ignoreSync) {
                ignoreSync = true;
                if (room.isPlaying) {
                    video.play().catch(e => console.log('播放失败'));
                } else {
                    video.pause();
                }
                setTimeout(() => { ignoreSync = false; }, 300);
            }
            
            // 同步视频地址（如果不同）
            if (room.videoUrl && room.videoUrl !== videoUrl.value && !ignoreSync) {
                videoUrl.value = room.videoUrl;
                video.src = room.videoUrl;
                video.load();
                showMessage(`🎬 同步视频: ${room.videoUrl.slice(-30)}`);
            }
            
            lastSyncTime = Date.now();
        } catch (err) {
            console.error('轮询失败:', err);
        }
    }
    
    // 强制发送同步信号
    async function forceSync() {
        await sendHeartbeat();
        showMessage('📡 已发送同步信号');
        setTimeout(() => pollRoom(), 500);
    }
    
    // 离开房间
    async function leaveRoom() {
        if (currentRoomId) {
            try {
                await fetch(API_URL, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId: currentRoomId })
                });
            } catch (err) {
                console.error('离开房间失败:', err);
            }
        }
        
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        if (pollInterval) clearInterval(pollInterval);
        
        currentRoomId = null;
        isInRoom = false;
        updateStatus(false);
        viewerCountSpan.innerHTML = '👥 未加入';
    }
    
    // 加入/创建房间
    joinBtn.onclick = async () => {
        let room = roomInput.value.trim();
        if (!room) {
            room = Math.floor(Math.random() * 10000).toString();
            roomInput.value = room;
        }
        
        // 先离开当前房间
        await leaveRoom();
        // 加入新房间
        await joinRoom(room);
    };
    
    copyRoomBtn.onclick = () => {
        const roomToCopy = currentRoomId || roomInput.value.trim();
        if (roomToCopy) {
            navigator.clipboard.writeText(roomToCopy);
            showMessage(`房间号 ${roomToCopy} 已复制`);
        } else {
            showMessage('请先输入或创建房间');
        }
    };
    
    // 播放/暂停
    playPauseBtn.onclick = () => {
        if (video.paused) {
            video.play().catch(e => console.log('播放失败'));
        } else {
            video.pause();
        }
        sendHeartbeat();
    };
    
    forceSyncBtn.onclick = () => {
        forceSync();
    };
    
    // 加载视频
    loadVideoBtn.onclick = () => {
        const url = videoUrl.value.trim();
        if (url) {
            video.src = url;
            video.load();
            showMessage('🎬 加载视频中...');
            video.addEventListener('loadedmetadata', () => {
                sendHeartbeat();
            }, { once: true });
        }
    };
    
    // 预设视频
    document.querySelectorAll('.preset').forEach(btn => {
        btn.onclick = () => {
            const url = btn.dataset.url;
            videoUrl.value = url;
            loadVideoBtn.click();
        };
    });
    
    // 视频事件触发心跳
    video.addEventListener('play', () => sendHeartbeat());
    video.addEventListener('pause', () => sendHeartbeat());
    video.addEventListener('seeked', () => sendHeartbeat());
    
    // 页面关闭时离开房间
    window.addEventListener('beforeunload', () => {
        if (currentRoomId) {
            fetch(API_URL, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId: currentRoomId })
            });
        }
    });
    
    // 随机默认房间号
    roomInput.value = Math.floor(Math.random() * 10000);
    
    showMessage('✨ 输入相同房间号，两人都点「加入/创建房间」即可同步（延迟约2-3秒）');
</script>
</body>
</html>
