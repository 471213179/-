<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同步观影 · 支持MP4/M3U8/TS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0e1a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:16px;
}

.container{
    max-width:1100px;
    margin:0 auto;
}

.video-wrapper{
    background:black;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
}

.controls{
    margin-top:16px;
    background:#11161f;
    border-radius:20px;
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
}

button{
    border:none;
    background:#2a3650;
    color:white;
    padding:10px 18px;
    border-radius:40px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#3a4660;
}

button.primary{
    background:#4f46e5;
}

button.primary:hover{
    background:#6366f1;
}

input{
    background:#1a2233;
    border:1px solid #2f3b54;
    color:white;
    padding:10px 14px;
    border-radius:40px;
    outline:none;
}

input:focus{
    border-color:#4f46e5;
}

#roomInput{
    flex:1;
    min-width:120px;
}

#videoUrl{
    width:100%;
    margin-top:12px;
}

.status{
    margin-left:auto;
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}

.viewer{
    background:#1a2233;
    padding:8px 14px;
    border-radius:40px;
    font-size:13px;
}

.toast{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:#4f46e5;
    padding:8px 20px;
    border-radius:40px;
    font-size:13px;
    z-index:9999;
    animation:fadeInOut 2s ease;
}

.toast.error{
    background:#dc2626;
}

@keyframes fadeInOut{
    0%{opacity:0;transform:translateX(-50%) translateY(10px);}
    15%{opacity:1;transform:translateX(-50%) translateY(0);}
    85%{opacity:1;}
    100%{opacity:0;transform:translateX(-50%) translateY(-10px);}
}

.format-badge{
    position:absolute;
    bottom:10px;
    right:10px;
    background:rgba(0,0,0,0.6);
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    pointer-events:none;
}

</style>

<!-- HLS.js 支持 m3u8 播放 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>

<body>

<div class="container">

    <div class="video-wrapper">

        <video
            id="video"
            controls
            preload="metadata"
            controlsList="nodownload"
            crossorigin="anonymous"
        >
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4">
        </video>
        <div class="format-badge" id="formatBadge">📹 MP4</div>

    </div>

    <div class="controls">

        <input
            id="roomInput"
            placeholder="输入房间号"
        >

        <button
            id="joinBtn"
            class="primary"
        >
            🚪 创建房间
        </button>

        <button id="copyBtn">
            📋 复制房间号
        </button>

        <button id="syncBtn">
            🔄 强制同步
        </button>

        <div
            class="viewer"
            id="viewerCount"
        >
            👥 未加入
        </div>

        <div
            class="status"
            id="status"
        >
            ⚪ 未连接
        </div>

    </div>

    <input
        id="videoUrl"
        value="https://media.w3.org/2010/05/sintel/trailer.mp4"
        placeholder="支持: MP4 / M3U8 / TS 直链"
    >

</div>

<script>

const API_URL = '/api/rooms';

const video =
    document.getElementById('video');

const roomInput =
    document.getElementById('roomInput');

const joinBtn =
    document.getElementById('joinBtn');

const copyBtn =
    document.getElementById('copyBtn');

const syncBtn =
    document.getElementById('syncBtn');

const statusEl =
    document.getElementById('status');

const viewerCount =
    document.getElementById('viewerCount');

const videoUrl =
    document.getElementById('videoUrl');

const formatBadge =
    document.getElementById('formatBadge');

let currentRoom = null;

let isSyncing = false;

let pollInterval = null;

let isHost = false;

let hls = null; // HLS 实例

const clientId =
    localStorage.getItem('clientId') ||
    Math.random().toString(36).slice(2);

localStorage.setItem(
    'clientId',
    clientId
);

function showMessage(msg, isError = false){
    const oldToast = document.querySelector('.toast');
    if(oldToast) oldToast.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.textContent = msg;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.remove(), 2500);
}

function updateStatus(text){
    statusEl.innerHTML = text;
}

// 智能加载视频（支持 MP4 / M3U8 / TS）
function loadVideo(url){
    // 销毁旧的 HLS 实例
    if(hls){
        hls.destroy();
        hls = null;
    }
    
    // 检测格式并更新徽章
    if(url.includes('.m3u8')){
        formatBadge.innerHTML = '📡 M3U8 流';
        
        if(Hls.isSupported()){
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                showMessage('✅ M3U8 加载成功');
                video.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                console.error('HLS错误:', data);
                showMessage('❌ M3U8 加载失败', true);
            });
            return true;
        } else if(video.canPlayType('application/vnd.apple.mpegurl')){
            video.src = url;
            return true;
        } else {
            showMessage('❌ 当前浏览器不支持 M3U8', true);
            return false;
        }
    }
    else if(url.includes('.ts')){
        formatBadge.innerHTML = '🎬 TS 直链';
        video.src = url;
        video.load();
        return true;
    }
    else{
        formatBadge.innerHTML = '🎬 MP4';
        video.src = url;
        video.load();
        return true;
    }
}

async function joinRoom(roomId){

    try{

        const res =
            await fetch(API_URL,{
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    roomId,
                    clientId,
                    currentTime:video.currentTime,
                    isPlaying:!video.paused,
                    videoUrl:videoUrl.value
                })
            });

        const data =
            await res.json();

        if(data.success){

            currentRoom = roomId;

            isHost =
                data.room?.host === clientId ||
                data.isMaster;

            updateStatus(
                isHost
                ? `👑 房主: ${roomId}`
                : `👤 成员: ${roomId}`
            );

            showMessage(
                isHost
                ? `✅ 你是房主，可以控制播放`
                : `✅ 已加入房间，将自动同步`
            );

            if(pollInterval){
                clearInterval(
                    pollInterval
                );
            }

            // 成员轮询间隔 2秒，房主 5秒
            const interval = isHost ? 5000 : 2000;
            pollInterval =
                setInterval(
                    pollRoom,
                    interval
                );

            pollRoom();
        }

    }catch(e){
        console.log(e);
        showMessage('❌ 加入房间失败', true);
    }
}

async function pollRoom(){

    if(!currentRoom) return;

    try{

        const res =
            await fetch(
                `${API_URL}?roomId=${currentRoom}`
            );

        const data =
            await res.json();

        if(
            !data.success ||
            !data.room
        ){
            return;
        }

        const room =
            data.room;

        viewerCount.innerHTML =
            `👥 ${room.viewers || 1} 人`;

        // 房主不接收同步（只更新人数）
        if(isHost){
            return;
        }

        if(isSyncing) return;

        isSyncing = true;

        try{

            // 视频链接同步
            if(
                room.videoUrl &&
                room.videoUrl !==
                videoUrl.value
            ){

                videoUrl.value =
                    room.videoUrl;

                loadVideo(room.videoUrl);
                
                showMessage('🎬 同步视频中...');
            }

            // 播放/暂停同步
            if(
                room.isPlaying &&
                video.paused
            ){

                await video.play()
                    .catch(()=>{});
            }

            if(
                !room.isPlaying &&
                !video.paused
            ){

                video.pause();
            }

            // 时间同步（差异大于 0.5 秒）
            const diff =
                Math.abs(
                    video.currentTime -
                    room.currentTime
                );

            if(diff > 0.5 && room.currentTime < video.duration){

                video.currentTime =
                    room.currentTime;
            }

        }finally{

            setTimeout(()=>{

                isSyncing = false;

            },200);
        }

    }catch(e){
        console.log(e);
    }
}

async function syncNow(){

    // 只有房主上传状态
    if(!isHost) return;

    if(!currentRoom || isSyncing) return;

    try{

        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                action:'heartbeat',
                roomId:currentRoom,
                clientId,
                currentTime:video.currentTime,
                isPlaying:!video.paused,
                videoUrl:videoUrl.value
            })
        });

    }catch(e){
        console.log(e);
    }
}

// 播放同步
video.addEventListener(
    'play',
    ()=>{
        syncNow();
    }
);

// 暂停同步
video.addEventListener(
    'pause',
    ()=>{
        syncNow();
    }
);

// 拖动同步（防抖）
let seekTimer;
video.addEventListener(
    'seeked',
    ()=>{
        clearTimeout(seekTimer);
        seekTimer = setTimeout(() => syncNow(), 100);
    }
);

// 每秒更新一次时间（仅房主）
setInterval(()=>{

    if(
        currentRoom &&
        isHost &&
        !video.paused
    ){

        syncNow();
    }

},2000);

// 创建/加入房间
joinBtn.onclick =
    async ()=>{

        let room =
            roomInput.value.trim();

        if(!room){

            room =
                Math.floor(
                    Math.random()*10000
                ).toString();

            roomInput.value =
                room;
        }

        // 先离开旧房间
        if(currentRoom){
            await fetch(API_URL,{
                method:'DELETE',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    roomId:currentRoom,
                    clientId
                })
            });
            
            if(pollInterval){
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        isHost = true;
        await joinRoom(room);
    };

// 回车加入别人房间
roomInput.addEventListener(
    'keydown',
    async (e)=>{

        if(e.key === 'Enter'){

            const room =
                roomInput.value.trim();

            if(!room) return;

            // 先离开旧房间
            if(currentRoom){
                await fetch(API_URL,{
                    method:'DELETE',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        roomId:currentRoom,
                        clientId
                    })
                });
                
                if(pollInterval){
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }

            isHost = false;
            await joinRoom(room);
        }
    }
);

copyBtn.onclick =
    ()=>{

        const room =
            currentRoom ||
            roomInput.value.trim();

        if(!room) return;

        navigator.clipboard
            .writeText(room);
            
        showMessage(`📋 房间号 ${room} 已复制`);
    };

syncBtn.onclick =
    ()=>{

        if(isHost){
            syncNow();
            showMessage('📡 已广播同步信号');
        } else {
            pollRoom();
            showMessage('📡 正在同步房主进度');
        }
    };

// 加载视频（支持 MP4 / M3U8 / TS）
videoUrl.addEventListener(
    'change',
    ()=>{

        const url = videoUrl.value.trim();
        
        if(!url) return;
        
        loadVideo(url);
        
        // 如果是房主，广播视频地址
        if(isHost && currentRoom){
            setTimeout(() => syncNow(), 500);
        }
        
        showMessage('🎬 加载视频中...');
    }
);

window.addEventListener(
    'beforeunload',
    ()=>{

        if(!currentRoom) return;

        fetch(API_URL,{
            method:'DELETE',
            headers:{
                'Content-Type':
                    'application/json'
            },
            body:JSON.stringify({
                roomId:currentRoom,
                clientId
            })
        });
    }
);

roomInput.value =
    Math.floor(
        Math.random()*10000
    );

// 初始化提示
showMessage('✨ 支持 MP4 / M3U8 / TS 视频源');

</script>

</body>
</html>
